name: Universal Pipeline

on:
  #schedule:
  #  - cron: '7 */1 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Specific target (all, universal_module, universal_ruleset, or author name)'
        required: false
        default: 'all'

jobs:
  sync-manager:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.target != 'merge' }}
    permissions:
      contents: write
    services:
      docker:
        image: xream/script-hub:latest
        ports: [9100:9100, 9101:9101]
    
    strategy:
      fail-fast: false
      matrix:
        author: [
          universal_module,
          universal_ruleset
        ]

    steps:
      - name: Check Input
        id: check
        run: |
          TARGET="${{ github.event.inputs.target }}"
          CURRENT_MATRIX="${{ matrix.author }}"

          # 定时触发或选择 all，全跑
          if [[ "${{ github.event_name }}" == "schedule" || "$TARGET" == "all" || -z "$TARGET" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "target_author=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 场景 1: 输入了具体的流程名 (universal_module 或 universal_ruleset)
          if [[ "$TARGET" == "universal_module" || "$TARGET" == "universal_ruleset" ]]; then
            if [[ "$CURRENT_MATRIX" == "$TARGET" ]]; then
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "target_author=" >> $GITHUB_OUTPUT
            else
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # 场景 2: 输入了具体的作者名
          # 默认路由至 universal_module 流程执行，并传递目标作者变量
          if [[ "$CURRENT_MATRIX" == "universal_module" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "target_author=$TARGET" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4.2.2
        if: steps.check.outputs.skip != 'true'

      - name: Checkout Logic Scripts
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ShalalaLala
          path: .remote_logic
          token: ${{ secrets.ACTION_TOKEN }}
                    
      - name: Run Sync Script
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          CURRENT_REPO_NAME: ${{ github.event.repository.name || 'Romeo' }}
          TARGET_AUTHOR: ${{ steps.check.outputs.target_author }}
        run: |
          REPO_NAME="${CURRENT_REPO_NAME}"
          target_script=".remote_logic/Scripts/${REPO_NAME}/${{ matrix.author }}.sh"
          
          if [ -f "$target_script" ]; then
            chmod +x "$target_script"
            sleep $((RANDOM % 5))
            bash "$target_script"
          else
            echo "❌ Script not found: $target_script"
            exit 1
          fi

  final-merge:
    needs: sync-manager 
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Checkout Logic Scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ShalalaLala
          path: .remote_logic
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Run Merge Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_NAME="${{ github.event.repository.name || 'Romeo' }}"
          target_script=".remote_logic/Scripts/${REPO_NAME}/merge_modules.sh"
          if [ -f "$target_script" ]; then
            chmod +x "$target_script"
            bash "$target_script"
          fi

  cleanup:
    needs: final-merge
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
